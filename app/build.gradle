 * This file was generated by the Gradle 'init' task.
 *
 * This generated file contains a sample Java application project to get you started.
 * For more details on building Java & JVM projects, please refer to https://docs.gradle.org/8.12/userguide/building_java_projects.html in the Gradle documentation.
 */

plugins {
    // Java ve Protobuf desteği için gerekli pluginler
    id 'application'
    id 'java'
    id 'com.google.protobuf' version '0.9.4' // Protobuf plugin
}

repositories {
    // Maven Central deposunu kullanıyoruz.
    mavenCentral()
}

dependencies {
    // JUnit Jupiter test framework bağımlılıkları
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.3' // JUnit bağımlılığını doğrudan ekledik
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.9.3'

    // Google Protobuf bağımlılığı
    implementation 'com.google.protobuf:protobuf-java:3.19.6' // Protobuf runtime desteği
    implementation 'com.google.protobuf:protoc:3.19.6' // Protobuf derleyici
    implementation 'com.google.guava:guava:31.1-jre' // Guava bağımlılığı
}

java {
    // Java 21 sürümünü kullanmak için ayar
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    // Ana sınıfın tanımlanması
    mainClass = 'org.example.App'
}

tasks.named('test') {
    // JUnit Platform'u kullanmak için ayar
    useJUnitPlatform()
}

protobuf {
    protoc {
        // Protobuf derleyici sürümünü belirtiyoruz
        artifact = "com.google.protobuf:protoc:3.19.6"
    }
    generateProtoTasks {
        // Tüm Protobuf derleme görevlerini yapılandırıyoruz
        all().each { task ->
            task.builtins {
                java {}
            }
        }
    }
}
