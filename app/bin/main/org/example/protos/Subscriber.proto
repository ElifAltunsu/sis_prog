syntax = "proto3";

package org.example.protos;

message Subscriber {
  int32 ID = 1;               // Abone ID'si
  string name_surname = 2;    // Ad ve soyad
  int64 start_date = 3;       // Başlangıç tarihi
  int64 last_accessed = 4;    // Son erişim tarihi
  repeated string interests = 5;  // İlgi alanları
  bool isOnline = 6;          // Online durumu
  enum Demand {
    SUBS = 0;  // Abonelik talebi
    DEL = 1;   // Abonelik iptali
    UPDT = 2;  // Güncelleme talebi
  }
  Demand demand = 7;
}
